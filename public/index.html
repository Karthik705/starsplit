<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Starsplit — split bills under the stars</title>
  <meta name="description" content="Split expenses with friends and watch the tangled web of debts untangle into a constellation.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23007aff'/><text x='50' y='71' font-size='60' text-anchor='middle' fill='white'>✦</text></svg>">
  <script>
    // apply the saved theme before first paint to avoid a flash
    try { const t = localStorage.getItem('starsplit:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><span></span><span></span><span></span></div>
  <header id="nav" class="nav"></header>
  <div id="tip" role="tooltip"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <main id="app"></main>
  <dialog id="modal"></dialog>
  <script src="app.js"></script>
</body>
</html>
