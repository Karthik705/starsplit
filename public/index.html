<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Starsplit · split bills under the stars</title>
  <meta name="description" content="Split expenses with friends and watch the tangled web of debts untangle into a constellation. Free, no sign-up, live sync.">
  <meta property="og:title" content="Starsplit · split bills under the stars">
  <meta property="og:description" content="Split expenses with friends and watch the tangled web of debts untangle into the fewest payments.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    // apply the saved theme before first paint to avoid a flash
    try { const t = JSON.parse(localStorage.getItem('starsplit:theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/group.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/sheet.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="modulepreload" href="js/main.js">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <div class="sky" aria-hidden="true"><span></span><span></span><span></span></div>
  <header id="nav" class="nav"></header>
  <div id="tip" role="tooltip"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <main id="app" tabindex="-1"></main>
  <footer class="site-footer">
    <span>✦ Starsplit</span>
    <span>Money is kept in whole cents, so splits always add up.</span>
    <a href="https://github.com/Karthik705/starsplit" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>
  <dialog id="modal" aria-label="Sheet"></dialog>
  <noscript><p style="text-align:center;padding:40px">Starsplit needs JavaScript to run.</p></noscript>
</body>
</html>
